<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/pinisi.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PINISI ERP — dashboard terpadu untuk operasional perusahaan."
    />
    <script>
      (() => {
        const storedPreference = localStorage.getItem('pinisi-theme')
        const preference = ['light', 'dark', 'system'].includes(storedPreference)
          ? storedPreference
          : 'system'
        const resolvedTheme = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference

        document.documentElement.dataset.theme = resolvedTheme
        document.documentElement.dataset.themePreference = preference
        document.documentElement.style.colorScheme = resolvedTheme
      })()
    </script>
    <title>PINISI ERP</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
